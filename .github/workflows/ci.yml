name: CI
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 is the arm64 macOS 26 image (actions/runner-images README)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project Synapse.xcodeproj -scheme Synapse -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
      - name: Unit tests
        run: scripts/unit-tests.sh build/Build/Products/Release/mlx-swift_Cmlx.bundle
