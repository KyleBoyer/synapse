name: Synapse
options:
  bundleIdPrefix: app.synapse
  deploymentTarget:
    macOS: "26.0"
packages:
  SynapseCore:
    path: Packages/SynapseCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Synapse:
    type: application
    platform: macOS
    sources:
      - path: Synapse
        excludes: ["Resources/**"]
      - path: Synapse/Resources
        buildPhase: resources
    dependencies:
      - package: SynapseCore
        product: SynapseCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.synapse.mac
        PRODUCT_NAME: Synapse
        MARKETING_VERSION: "0.1.6"
        CURRENT_PROJECT_VERSION: "7"
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        # Sparkle's keys; Xcode merges them with the generated ones.
        INFOPLIST_FILE: Synapse/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Synapse/Synapse.entitlements
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Synapse transcribes and talks with local models; audio never leaves this Mac."
        INFOPLIST_KEY_NSCameraUsageDescription: "Synapse shows camera frames to local models; video never leaves this Mac."
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "6.0"
    postBuildScripts:
      - name: Embed llama-server
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="$SRCROOT/vendor/llama.cpp/bin/llama-server"
          if [ ! -x "$SRC" ]; then echo "error: run scripts/build-llama.sh first"; exit 1; fi
          cp "$SRC" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/llama-server"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ]; then
            codesign --force --options runtime -s "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/llama-server"
          fi
      - name: Embed ffmpeg
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="$SRCROOT/vendor/ffmpeg/bin/ffmpeg"
          if [ ! -x "$SRC" ]; then echo "error: run scripts/build-ffmpeg.sh first"; exit 1; fi
          cp "$SRC" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/ffmpeg"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ]; then
            codesign --force --options runtime -s "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/ffmpeg"
          fi
